name: capsi

description: Capsi — messages and files, device to device.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  path_provider: ^2.1.5
  # file_selector replaces file_picker: it is the Flutter team's own plugin and
  # supports AGP 9, which file_picker's android_file_picker module does not.
  file_selector: ^1.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/capsi-logo-512.png
