[workspace]

[package]
name = "capsi-ffi"
version = "1.0.2"
edition = "2021"
license = "MIT"
authors = ["CAPSICOM"]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
capsi-core = { path = "../../crates/capsi-core" }
tokio = { version = "1", features = ["rt", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
