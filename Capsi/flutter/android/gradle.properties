org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.compiler.execution.strategy=in-process
# Kotlin's incremental compilation fails on this Windows machine with
# "Could not close incremental caches": the persistent *.tab maps it keeps are
# still locked by another handle (antivirus scanning the freshly written files
# is the usual cause on Windows) by the time Gradle tries to close them, which
# aborts :file_selector_android:compileReleaseKotlin. Turning incremental
# compilation off means those caches are never created, so there is nothing to
# close. Builds get slower, but they complete, and a release build that fails
# for a reason unrelated to the source is worse than a slow one.
kotlin.incremental=false
org.gradle.workers.max=2
