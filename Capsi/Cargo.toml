[workspace]
resolver = "2"
members = [
    "crates/capsi-core",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["CAPSICOM"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
base64 = "0.22"
hex = "0.4"

# Capsi is meant to stay small and start fast: optimise release builds for size.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
