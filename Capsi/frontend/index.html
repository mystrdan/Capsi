<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Capsi</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>
  <main>
    <div class="mobile-topbar" aria-label="Capsi mobile navigation">
      <button class="mobile-menu-btn" id="btn-mobile-menu" type="button" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand"><span class="brand-dot"></span><span class="brand-name">Capsi</span></div>
      <button class="btn-icon" id="btn-mobile-settings" title="Settings" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zM19.4 15a7.9 7.9 0 0 0 .1-3l2-1.5-2-3.5-2.4 1a7.7 7.7 0 0 0-2.6-1.5l.3-2.5h-4.1l-.3 2.5a7.7 7.7 0 0 0-2.6 1.5l-2.4-1-2 3.5 2 1.5a7.9 7.9 0 0 0 .1 3l-2 1.5 2 3.5 2.4-1a7.7 7.7 0 0 0 2.6 1.5l.3 2.5h4.1l.3-2.5a7.7 7.7 0 0 0 2.6-1.5l2.4 1 2-3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="mobile-menu-backdrop" id="mobile-menu-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand"><span class="brand-dot"></span><span class="brand-name">Capsi</span></div>
        <button class="btn-icon" id="btn-settings" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zM19.4 15a7.9 7.9 0 0 0 .1-3l-2-1.5 2-3.5-2.4-1a7.7 7.7 0 0 0-2.6-1.5l-.3-2.5h-4.1l-.3 2.5a7.7 7.7 0 0 0-2.6 1.5l-2.4-1-2 3.5 2 1.5a7.9 7.9 0 0 0 .1 3l-2 1.5 2 3.5 2.4-1a7.7 7.7 0 0 0 2.6 1.5l.3 2.5h4.1l.3-2.5a7.7 7.7 0 0 0 2.6-1.5l2.4 1 2-3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <nav class="nav-tabs">
        <button class="nav-tab active" data-panel="conversations">Conversations</button>
        <button class="nav-tab" data-panel="peers">Nearby</button>
        <button class="nav-tab" data-panel="transfers">Files</button>
        <button class="nav-tab" data-panel="workplace">Workplace</button>
      </nav>
      <div class="panel-list" id="panel-conversations">
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24" width="40" height="40"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z" fill="currentColor"/></svg>
          <p>No conversations yet.</p>
          <p class="muted">Open the app on another device on the same network to start chatting.</p>
        </div>
      </div>
      <div class="panel-list hidden" id="panel-peers"></div>
      <div class="panel-list hidden" id="panel-transfers"></div>
      <div class="panel-list hidden" id="panel-workplace"></div>
    </aside>

    <section class="chat-area">
      <div class="chat-header" id="chat-header"><div class="chat-status" id="chat-status">Select a conversation</div></div>
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer">
        <textarea id="message-input" placeholder="Type a message&#10;Press Enter to send" rows="1" disabled></textarea>
        <button class="btn-send" id="btn-send" disabled><svg viewBox="0 0 24 24" width="20" height="20"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/></svg></button>
      </form>
    </section>

    <aside class="detail-panel hidden" id="detail-panel">
      <div class="detail-header"><h2 id="detail-title">Details</h2><button class="btn-close" id="btn-close-detail"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg></button></div>
      <div class="detail-body" id="detail-body"></div>
    </aside>

    <nav class="mobile-nav" aria-label="Capsi sections">
      <button class="active" data-mobile-panel="conversations"><span>●</span><span>Chats</span></button>
      <button data-mobile-panel="peers"><span>⌁</span><span>Nearby</span></button>
      <button data-mobile-panel="transfers"><span>□</span><span>Files</span></button>
      <button data-mobile-panel="workplace"><span>#</span><span>Workplace</span></button>
    </nav>
  </main>
  <div class="toast" id="toast"></div>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/mobile.js"></script>
</body>
</html>
