<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B101A">
  <title>Capsi</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>
  <main>
    <div class="mobile-topbar" aria-label="Capsi mobile navigation">
      <button class="mobile-menu-btn" id="btn-mobile-menu" type="button" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand"><span class="brand-dot"></span><span class="brand-name">Capsi</span></div>
      <button class="btn-icon settings-button" id="btn-mobile-settings" title="Settings" type="button" aria-label="Open Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm8 3.8-2.05-.74a6.36 6.36 0 0 0-.5-1.2l.9-1.99-1.42-1.42-1.99.9c-.38-.21-.78-.38-1.2-.5L13 5H11l-.74 2.05c-.42.12-.82.29-1.2.5l-1.99-.9-1.42 1.42.9 1.99c-.21.38-.38.78-.5 1.2L4 12v2l2.05.74c.12.42.29.82.5 1.2l-.9 1.99 1.42 1.42 1.99-.9c.38.21.78.38 1.2.5L11 21h2l.74-2.05c.42-.12.82-.29 1.2-.5l1.99.9 1.42-1.42-.9-1.99c.21-.38.38-.78.5-1.2L20 14v-2Z" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="mobile-menu-backdrop" id="mobile-menu-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="brand"><span class="brand-dot"></span><span class="brand-name">Capsi</span></div><button class="btn-icon settings-button" id="btn-settings" title="Settings" type="button" aria-label="Open Settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm8 3.8-2.05-.74a6.36 6.36 0 0 0-.5-1.2l.9-1.99-1.42-1.42-1.99.9c-.38-.21-.78-.38-1.2-.5L13 5H11l-.74 2.05c-.42.12-.82.29-1.2.5l-1.99-.9-1.42 1.42.9 1.99c-.21.38-.38.78-.5 1.2L4 12v2l2.05.74c.12.42.29.82.5 1.2l-.9 1.99 1.42 1.42 1.99-.9c.38.21.78.38 1.2-.5L11 21h2l.74-2.05c.42-.12.82-.29 1.2-.5l1.99.9 1.42-1.42-.9-1.99c.21-.38.38-.78.5-1.2L20 14v-2Z" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/></svg></button></div>
      <nav class="nav-tabs" aria-label="Capsi sections"><button class="nav-tab active" data-panel="conversations">Conversations</button><button class="nav-tab" data-panel="peers">Nearby</button><button class="nav-tab" data-panel="transfers">Files</button><button class="nav-tab" data-panel="workplace">Workplace</button></nav>
      <div class="panel-list" id="panel-conversations"><div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z" fill="currentColor"/></svg><p>No conversations yet.</p><p class="muted">Open the app on another device on the same network to start chatting.</p></div></div>
      <div class="panel-list hidden" id="panel-peers"></div><div class="panel-list hidden" id="panel-transfers"></div><div class="panel-list hidden" id="panel-workplace"></div>
    </aside>

    <section class="chat-area"><div class="chat-header" id="chat-header"><div class="chat-status" id="chat-status">Select a conversation</div></div><div class="messages" id="messages"></div><form class="composer" id="composer"><textarea id="message-input" placeholder="Type a message&#10;Press Enter to send" rows="1" disabled></textarea><button class="btn-send" id="btn-send" type="submit" disabled aria-label="Send message"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/></svg></button></form></section>

    <aside class="detail-panel hidden" id="detail-panel"><div class="detail-header"><h2 id="detail-title">Settings</h2><button class="btn-close" id="btn-close-detail" type="button" aria-label="Close Settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div><div class="detail-body" id="detail-body"></div></aside>

    <nav class="mobile-nav" aria-label="Capsi sections">
      <button class="active" data-mobile-panel="conversations" aria-label="Chats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3H4a2 2 0 0 0-2 2v13l4-3h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Chats</span></button>
      <button data-mobile-panel="peers" aria-label="Nearby"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Nearby</span></button>
      <button data-mobile-panel="transfers" aria-label="Files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10l2 2h6.5A1.5 1.5 0 0 1 20 7.5v10A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Files</span></button>
      <button data-mobile-panel="workplace" aria-label="Workplace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h6v6H5zM13 5h6v6h-6zM5 13h6v6H5zM13 13h6v6h-6z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Workplace</span></button>
    </nav>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/bootstrap.js"></script>
</body>
</html>
