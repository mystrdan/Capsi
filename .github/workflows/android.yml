name: Capsi Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "Capsi/frontend/**"
      - "Capsi/src-tauri/**"
      - "Capsi/crates/**"
      - "Capsi/Cargo.toml"
      - "Capsi/Cargo.lock"
      - ".github/workflows/android.yml"
  # When release.yml publishes a GitHub Release from a v* tag, rebuild the
  # APK for that same commit and attach it to the release. Triggering on
  # workflow_run (instead of the tag directly) serializes the two asset
  # uploaders, so they never race on creating/updating the release.
  workflow_run:
    workflows: ["Capsi Windows release"]
    types: [completed]

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Skip if this run was triggered by a release workflow that failed.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # contents:write is required by softprops/action-gh-release to publish
    # assets into the GitHub Release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Capsi

    steps:
      - name: Checkout
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      # On workflow_run, build the exact commit the release was cut from
      # (the v* tag commit), not the default branch.
      - name: Checkout release commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Tauri's Android build requires the NDK; `setup-android` only installs the
      # command line tools and platform packages. This mirrors the NDK setup used
      # by Tauri's own Android CI workflow.
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The Android project (including the Gradle wrapper) is committed, so
      # `init` is only needed when it is missing. Git on Windows cannot record
      # the executable bit, so the wrapper is made executable on the runner.
      - name: Prepare Android project
        run: |
          if [ -f src-tauri/gen/android/gradlew ]; then
            chmod +x src-tauri/gen/android/gradlew
          else
            cargo tauri android init
          fi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build Android debug APK
        run: cargo tauri android build --debug --apk
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Capsi-Android-debug
          path: Capsi/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      # When this run was triggered by a published v* GitHub Release, attach
      # the APK to that release as well (workflow_run guarantees release.yml
      # already created the release, so no race; the body is left untouched).
      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: Capsi/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

