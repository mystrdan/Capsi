name: Capsi Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "Capsi/frontend/**"
      - "Capsi/src-tauri/**"
      - "Capsi/crates/**"
      - "Capsi/Cargo.toml"
      - "Capsi/Cargo.lock"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Tauri's Android build requires the NDK; `setup-android` only installs the
      # command line tools and platform packages. This mirrors the NDK setup used
      # by Tauri's own Android CI workflow.
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The Android project (including the Gradle wrapper) is committed, so
      # `init` is only needed when it is missing. Git on Windows cannot record
      # the executable bit, so the wrapper is made executable on the runner.
      - name: Prepare Android project
        run: |
          if [ -f src-tauri/gen/android/gradlew ]; then
            chmod +x src-tauri/gen/android/gradlew
          else
            cargo tauri android init
          fi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build Android debug APK
        run: cargo tauri android build --debug --apk
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Capsi-Android-debug
          path: Capsi/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
