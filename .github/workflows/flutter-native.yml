name: Capsi Flutter native bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "Capsi/flutter/native/**"
      - "Capsi/crates/capsi-core/**"
      - ".github/workflows/flutter-native.yml"
  pull_request:
    paths:
      - "Capsi/flutter/native/**"
      - "Capsi/crates/capsi-core/**"
      - ".github/workflows/flutter-native.yml"

jobs:
  rust-ffi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Flutter native bridge
        run: cargo check --manifest-path Capsi/flutter/native/Cargo.toml

      - name: Test Flutter native bridge
        run: cargo test --manifest-path Capsi/flutter/native/Cargo.toml
