name: Capsi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test core
        run: cargo test -p capsi-core

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Widget tests
        run: flutter test


  android:
    name: Android release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Generate Android runner
        run: flutter create --platforms=android .
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust Android libraries
        working-directory: Capsi/flutter/native
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android build attempt $attempt failed; retrying after Gradle download/network failure..."
              sleep 10
            fi
          done
          exit 1
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: capsi-android-apk
          path: Capsi/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  macos:
    name: macOS release build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate macOS runner
        run: flutter create --platforms=macos .
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS application
        run: flutter build macos --release

  ios:
    name: iOS release build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate iOS runner
        run: flutter create --platforms=ios .
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS application
        run: flutter build ios --release --no-codesign

  windows:
    name: Windows release build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows release
        shell: pwsh
        run: .\tool\build_windows.ps1
      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path .\build\windows\x64\runner\Release\* -DestinationPath .\build\Capsi-Windows-x64.zip -Force
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: capsi-windows-x64
          path: Capsi/flutter/build/Capsi-Windows-x64.zip
          if-no-files-found: error
