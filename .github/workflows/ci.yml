name: Capsi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test core
        run: cargo test -p capsi-core

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Widget tests
        run: flutter test

  android:
    name: Android release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Generate Android runner
        run: flutter create --platforms=android .
      - name: Configure Android compile SDK
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "Android app Gradle file not found."
            exit 1
          fi
          grep -R "compileSdk" android/app/build.gradle* || true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust Android libraries
        working-directory: Capsi/flutter/native
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android build attempt $attempt failed; retrying after Gradle download/network failure..."
              sleep 10
            fi
          done
          exit 1
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: capsi-android-apk
          path: Capsi/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  macos:
    name: macOS release build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Generate macOS runner
        run: flutter create --platforms=macos .
      - name: Configure macOS local networking
        run: bash ./tool/configure_apple_networking.sh
      - name: Build Rust macOS libraries
        working-directory: Capsi/flutter/native
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Upload Rust macOS libraries
        uses: actions/upload-artifact@v4
        with:
          name: capsi-rust-macos
          path: |
            Capsi/flutter/native/target/aarch64-apple-darwin/release/libcapsi_ffi.dylib
            Capsi/flutter/native/target/x86_64-apple-darwin/release/libcapsi_ffi.dylib
          if-no-files-found: error
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS application
        run: flutter build macos --release
      - name: Bundle Rust macOS library
        shell: bash
        run: |
          app="build/macos/Build/Products/Release/Capsi.app"
          framework_dir="$app/Contents/Frameworks"
          mkdir -p "$framework_dir"
          lipo -create             native/target/aarch64-apple-darwin/release/libcapsi_ffi.dylib             native/target/x86_64-apple-darwin/release/libcapsi_ffi.dylib             -output "$framework_dir/libcapsi_ffi.dylib"
          codesign --force --sign - "$framework_dir/libcapsi_ffi.dylib"
          codesign --deep --force --sign - "$app"
          test -f "$framework_dir/libcapsi_ffi.dylib"
      - name: Package macOS release
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent             "build/macos/Build/Products/Release/Capsi.app"             "build/Capsi-macOS.zip"
      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: capsi-macos
          path: Capsi/flutter/build/Capsi-macOS.zip
          if-no-files-found: error

  ios:
    name: iOS release build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Generate iOS runner
        run: flutter create --platforms=ios .
      - name: Configure iOS local networking
        run: bash ./tool/configure_apple_networking.sh
      - name: Build Rust iOS libraries
        working-directory: Capsi/flutter/native
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios
      - name: Link Rust FFI into iOS Runner
        run: bash ./tool/link_ios_rust.sh
      - name: Prepare iOS Rust FFI integration
        run: bash ./tool/prepare_ios.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Configure iOS Xcode project
        run: flutter build ios --config-only --no-codesign
      - name: Refresh CocoaPods integration
        shell: bash
        run: |
          cd ios
          pod install --repo-update
      - name: Build iOS application
        run: flutter build ios --release --no-codesign --no-pub
      - name: Verify iOS Rust symbols are linked
        shell: bash
        run: |
          app="build/ios/iphoneos/Runner.app/Runner"
          test -f "$app"
          echo "Checking exported Capsi FFI symbols in the iOS executable..."
          nm -gU "$app" | grep "_capsi_runtime_version"
          nm -gU "$app" | grep "_capsi_discovery_start"
          nm -gU "$app" | grep "_capsi_message_send"

  windows:
    name: Windows release build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows release
        shell: pwsh
        run: .\\tool\\build_windows.ps1
      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path .\\build\\windows\\x64\\runner\\Release\\* -DestinationPath .\\build\\Capsi-Windows-x64.zip -Force
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: capsi-windows-x64
          path: Capsi/flutter/build/Capsi-Windows-x64.zip
          if-no-files-found: error
