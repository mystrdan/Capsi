name: Capsi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test core
        run: cargo test -p capsi-core

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Widget tests
        run: flutter test

  windows:
    name: Windows release build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows release
        shell: pwsh
        run: .\tool\build_windows.ps1
      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path .\build\windows\x64\runner\Release\* -DestinationPath .\build\Capsi-Windows-x64.zip -Force
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: capsi-windows-x64
          path: Capsi/flutter/build/Capsi-Windows-x64.zip
          if-no-files-found: error
