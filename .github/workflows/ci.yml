name: Capsi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test core
        run: cargo test -p capsi-core

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Widget tests
        run: flutter test

  windows:
    name: Windows release build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows release
        shell: pwsh
        run: .\tool\build_windows.ps1
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: capsi-windows
          path: Capsi/flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
