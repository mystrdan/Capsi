name: Capsi Flutter validation

on:
  workflow_dispatch:
  push:
    paths:
      - "Capsi/flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "Capsi/flutter/**"
      - ".github/workflows/flutter.yml"

jobs:
  flutter-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Rust native bridge
        run: cargo test --manifest-path native/Cargo.toml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate platform scaffolding
        run: flutter create --platforms=windows .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Rust native bridge
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Rust native bridge
        shell: pwsh
        run: Copy-Item native/target/release/capsi_ffi.dll build/windows/x64/runner/Release/capsi_ffi.dll -Force

  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capsi/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Android
        run: flutter config --enable-android

      - name: Generate platform scaffolding
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release
